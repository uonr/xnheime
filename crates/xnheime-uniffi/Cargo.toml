[package]
name = "xnheime-uniffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32.0"
xnheime-core = { path = "../xnheime-core" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
